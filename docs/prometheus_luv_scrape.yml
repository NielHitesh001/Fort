global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'luv_terminal'
    static_configs:
      # Inside docker compose, use the engine service name rather than
      # localhost (which would resolve to the Prometheus container itself).
      - targets: ['luv-engine:9090']
    metrics_path: /metrics
    scheme: http
    scrape_interval: 10s
    authorization:
      type: Bearer
      # The compose file mounts a metrics-only credential here. For another
      # deployment, mount an equivalent file and adjust this path.
      credentials_file: /etc/prometheus/secrets/fort-metrics-auth/metrics-token
