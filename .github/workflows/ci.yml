name: CI

on:
  push:
  pull_request:

jobs:
  macos-websocket:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build socket tests
        run: cmake --build build --target luv_websocket luv_http_server luv_prometheus_export --parallel 4
      - name: Test socket lifecycle and latency
        run: ctest --test-dir build -R '^(websocket|http_server|prometheus_export)$' --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-websocket-test-log
          path: build/Testing/Temporary/LastTest.log
  parser-fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure libFuzzer
        run: cmake -S . -B build-fuzz -DCMAKE_CXX_COMPILER=clang++ -DLUV_ENABLE_FUZZING=ON
      - name: Build fuzz targets
        run: cmake --build build-fuzz --target fuzz_itch fuzz_ouch fuzz_fix fuzz_http fuzz_websocket --parallel 4
      - name: Exercise parsers with sanitizers
        run: |
          ./build-fuzz/fuzz_itch -runs=10000 -max_len=2048
          ./build-fuzz/fuzz_ouch -runs=10000 -max_len=2048
          ./build-fuzz/fuzz_fix -runs=10000 -max_len=2048 fuzz/corpus/fix
          ./build-fuzz/fuzz_http -runs=10000 -max_len=4096 fuzz/corpus/http
          ./build-fuzz/fuzz_websocket -runs=10000 -max_len=4096 fuzz/corpus/websocket
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: parser-fuzz-crashes
          path: |
            crash-*
            timeout-*
            leak-*
            oom-*
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLUV_ENABLE_LONG_STRESS_TESTS=ON -DLUV_STRESS_MESSAGES=250000
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DLUV_ENABLE_ASAN_UBSAN=ON -DLUV_ENABLE_LONG_STRESS_TESTS=OFF
      - name: Build
        run: cmake --build build-asan --parallel
      - name: Test
        run: ctest --test-dir build-asan --output-on-failure

  dpdk-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install DPDK development package
        run: sudo apt-get update && sudo apt-get install --yes libdpdk-dev pkg-config
      - name: Configure
        run: cmake -S . -B build-dpdk -DCMAKE_BUILD_TYPE=Release -DLUV_ENABLE_DPDK=ON -DLUV_ENABLE_LONG_STRESS_TESTS=ON -DLUV_STRESS_MESSAGES=250000
      - name: Build
        run: cmake --build build-dpdk --parallel
      - name: Test
        run: ctest --test-dir build-dpdk --output-on-failure -R 'feed|lob|execution|sequence_tracker|stress|crash_recovery'
