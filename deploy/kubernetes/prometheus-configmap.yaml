apiVersion: v1
kind: ConfigMap
metadata:
  name: luv-prometheus-config
  labels:
    app: luv-engine
data:
  prometheus.yml: |
    global:
      scrape_interval: 1s
      evaluation_interval: 1s

    scrape_configs:
      - job_name: 'luv_microstructure_engine'
        static_configs:
          - targets: ['luv-engine-service:9100']
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'luv_.*'
            action: keep
