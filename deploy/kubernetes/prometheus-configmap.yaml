apiVersion: v1
kind: ConfigMap
metadata:
  name: luv-prometheus-config
  labels:
    app: fort-engine
data:
  prometheus.yml: |
    global:
      scrape_interval: 1s
      evaluation_interval: 1s

    scrape_configs:
      - job_name: 'luv_microstructure_engine'
        static_configs:
          - targets: ['fort-engine:9090']
        # Mount the metrics-only fort-metrics-auth Secret at
        # /etc/prometheus/secrets/fort-metrics-auth in the Prometheus pod.
        authorization:
          type: Bearer
          credentials_file: /etc/prometheus/secrets/fort-metrics-auth/metrics-token
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'luv_.*'
            action: keep
