apiVersion: apps/v1
kind: Deployment
metadata:
  name: fort-engine
  labels:
    app: fort-engine
    tier: trading-core
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fort-engine
  template:
    metadata:
      labels:
        app: fort-engine
    spec:
      containers:
      - name: fort-engine
        image: ghcr.io/nielhitesh001/fort-luv-engine:latest
        imagePullPolicy: IfNotPresent
        # Dockerfile.dpdk installs luv_engine as the image entrypoint.
        args:
        - --http-port
        - "8080"
        - --prometheus-port
        - "9090"
        - --api-token-file
        - /var/run/secrets/fort-api-auth/api-token
        - --metrics-token-file
        - /var/run/secrets/fort-metrics-auth/metrics-token
        securityContext:
          capabilities:
            add:
            - SYS_NICE
            - IPC_LOCK
        resources:
          requests:
            cpu: "4"
            memory: "8Gi"
          limits:
            cpu: "8"
            memory: "16Gi"
        ports:
        - name: http-api
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: metrics
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: metrics
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        env:
        - name: LUV_ENV
          value: "staging"
        - name: LUV_LOG_LEVEL
          value: "INFO"
        - name: LUV_NUMA_NODE
          value: "0"
        volumeMounts:
        - name: audit-storage
          mountPath: /var/log/luv/audit
        - name: wal-storage
          mountPath: /var/log/luv/wal
        - name: api-auth
          mountPath: /var/run/secrets/fort-api-auth
          readOnly: true
        - name: metrics-auth
          mountPath: /var/run/secrets/fort-metrics-auth
          readOnly: true
      volumes:
      - name: audit-storage
        persistentVolumeClaim:
          claimName: luv-audit-pvc
      - name: wal-storage
        persistentVolumeClaim:
          claimName: luv-wal-pvc
      - name: api-auth
        secret:
          secretName: fort-api-auth
      - name: metrics-auth
        secret:
          secretName: fort-metrics-auth
