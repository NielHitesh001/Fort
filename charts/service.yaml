apiVersion: v1
kind: Service
metadata:
  name: fort-engine
  labels:
    app: fort-engine
spec:
  type: ClusterIP
  selector:
    app: fort-engine
  ports:
  - name: http-api
    port: 8080
    targetPort: http-api
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
